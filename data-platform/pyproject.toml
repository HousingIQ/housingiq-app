[project]
name = "housingiq-data-platform"
version = "0.1.0"
description = "HousingIQ Data Platform - ETL, transformations, and data quality"
requires-python = ">=3.11"
dependencies = [
    # Orchestration
    "dagster>=1.7",
    "dagster-webserver>=1.7",
    "dagster-postgres>=0.23",
    "dagster-dbt>=0.23",

    # Transformations
    "dbt-core>=1.8",
    "dbt-postgres>=1.8",

    # Data Quality
    "great-expectations>=0.18",

    # Processing
    "polars>=1.0",
    "duckdb>=1.0",

    # HTTP & Downloads
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "tqdm>=4.66",

    # Configuration
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",

    # Database
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",

    # CLI
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipython>=8.0",
    "jupyter>=1.0",
]

[project.scripts]
housingiq = "ingestion.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dagster", "ingestion"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["dagster", "ingestion"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
