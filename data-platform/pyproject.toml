[project]
name = "housingiq-data-platform"
version = "0.1.0"
description = "HousingIQ Data Platform - Dagster, Polars, Great Expectations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Orchestration
    "dagster>=1.6.0",
    "dagster-webserver>=1.6.0",
    "dagster-postgres>=0.22.0",

    # Data Quality
    "great-expectations>=0.18.0",

    # Data Processing (Polars replaces dbt for transformations)
    "polars>=0.20.0",
    "pyarrow>=14.0.0",

    # HTTP & Downloads
    "httpx>=0.26.0",

    # Validation
    "pydantic>=2.5.0",

    # Database
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "adbc-driver-postgresql>=1.0.0",
    "connectorx>=0.3.0",  # For Polars read_database_uri
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "housingiq_dagster"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests requiring a running PostgreSQL instance (deselect with -m 'not integration')",
]
