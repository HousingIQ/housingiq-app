housingiq:
  target: dev
  outputs:
    dev:
      type: postgres
      host: localhost
      port: 5432
      user: housingiq
      password: housingiq
      dbname: housingiq
      schema: public
      threads: 4

    prod:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'housingiq') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'housingiq') }}"
      schema: public
      threads: 4
