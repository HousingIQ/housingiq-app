name: 'housingiq'
version: '1.0.0'
config-version: 2

profile: 'housingiq'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Model configurations
models:
  housingiq:
    # Staging models - views in staging schema
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging"]

    # Mart models - tables/incremental in analytics schema
    marts:
      +materialized: table
      +schema: analytics
      +tags: ["marts"]

    # App models - tables for webapp consumption
    app:
      +materialized: table
      +schema: app
      +tags: ["app"]

# Seed configurations
seeds:
  housingiq:
    +schema: seeds

# Test configurations
tests:
  housingiq:
    +severity: warn

# Snapshot configurations
snapshots:
  housingiq:
    +target_schema: snapshots

# Variables
vars:
  # Date range for processing
  start_date: '2000-01-01'
  end_date: '2030-12-31'

  # Default geography levels to process
  geography_levels:
    - National
    - State
    - Metro
    - County
    - City
    - Zip

  # Price tiers
  price_tiers:
    - All
    - Top-Tier
    - Mid-Tier
    - Bottom-Tier

# Dispatch for package overrides
dispatch:
  - macro_namespace: dbt_utils
    search_order: ['housingiq', 'dbt_utils']
